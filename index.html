<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DXF Toolkit — Xem &amp; đo bản vẽ</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Lưới an toàn: nếu app lỗi khi khởi động, hiện thông báo rõ ràng
         thay vì màn hình trắng để người dùng biết đường xử lý. -->
    <div id="boot-error" style="display:none;font-family:Segoe UI,Arial,sans-serif;
      max-width:640px;margin:60px auto;padding:24px;border:1px solid #cbd0d8;border-radius:8px;color:#20242c">
      <h2 style="margin:0 0 8px;font-size:18px">Không khởi động được công cụ</h2>
      <p style="margin:0 0 8px;font-size:14px;line-height:1.5">
        Nguyên nhân thường gặp: trình duyệt quá cũ. Hãy mở bằng
        <b>Google Chrome</b> hoặc <b>Microsoft Edge</b> phiên bản mới
        (menu ⋮ → Trợ giúp → Giới thiệu để cập nhật), rồi mở lại file này.
      </p>
      <p style="margin:0;font-size:12px;color:#626a78">Chi tiết kỹ thuật:
        <span id="boot-error-msg" style="font-family:monospace"></span></p>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root')
        if (root && root.children.length === 0) {
          document.getElementById('boot-error').style.display = 'block'
          document.getElementById('boot-error-msg').textContent = (e && e.message) || 'không rõ'
        }
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
